<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="Live map of every train in Sussex, placed from Network Rail train describer berth data.">
<link rel="apple-touch-icon" href="../shared/icon-180.png">
<link rel="icon" type="image/svg+xml" href="../shared/icon.svg">
<title>Sussex Train Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="map.css?v=202610311721">
</head>
<body>
<div id="map" aria-label="Map of trains in Sussex"></div>

<header class="bar">
  <div class="bar-row">
    <a class="bar-home" href="../" aria-label="Rail Crossing home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="bar-title">
      <div class="bar-name">Sussex train map</div>
      <div class="bar-status" id="status" aria-live="polite">Connecting…</div>
    </div>
    <form class="search" id="search" role="search">
      <input id="searchInput" type="search" inputmode="text" autocapitalize="characters" autocomplete="off"
             spellcheck="false" maxlength="4" placeholder="1H15" aria-label="Find a train by headcode">
    </form>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Show train types"></div>
</header>

<div class="demo-banner" id="demoBanner" hidden>DEMO — simulated trains, not live data</div>

<div class="tools">
  <button class="tool" id="btnLocate" type="button" aria-label="Centre on Sussex" title="Centre on Sussex">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button class="tool" id="btnLayers" type="button" aria-label="Map options" aria-expanded="false" title="Map options">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <div class="layers" id="layers" hidden>
    <label><input type="checkbox" id="optTracks" checked> Railway lines</label>
    <label><input type="checkbox" id="optLabels" checked> Headcode labels</label>
    <label><input type="checkbox" id="optDark" checked> Dark map</label>
    <label><input type="checkbox" id="optBerths"> Berth coverage</label>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-live="polite">
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">×</button>
  <div class="sheet-head">
    <span class="sheet-dot" id="sheetDot"></span>
    <span class="sheet-hc" id="sheetHc"></span>
    <span class="sheet-class" id="sheetClass"></span>
  </div>
  <div class="sheet-route" id="sheetRoute"></div>
  <div class="sheet-grid">
    <div><div class="k">Where</div><div class="v" id="sheetWhere"></div></div>
    <div><div class="k">Last berth step</div><div class="v" id="sheetAge"></div></div>
    <div><div class="k">Berth</div><div class="v" id="sheetBerth"></div></div>
    <div><div class="k">Heading</div><div class="v" id="sheetHeading"></div></div>
  </div>
  <label class="sheet-follow"><input type="checkbox" id="optFollow"> Follow this train</label>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="map.js?v=202610311721"></script>
<script data-goatcounter="https://richbroad29.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
